# 提交到 F-Droid 主仓库的元数据模板

# 用法：Fork https://gitlab.com/fdroid/fdroiddata ，把本文件复制到
# metadata/com.duolauncher.yml ，从 master 建分支 com.duolauncher ，
# 跑 fdroid lint / fdroid build 后在 GitLab 提 Merge Request。
#
# 本模板已按当前基准版 v1.5.14 / versionCode 197 填好，
# Builds[0].commit 已是 v1.5.14 tag 的完整 40 位 hash，提交前只需核对版本字段，
# 不要用 tag 名或分支名替换 commit。每次发版同步更新版本字段与 commit。
# 详细步骤与可直接粘贴的 MR 描述见 ../DISTRIBUTION.md

Categories:
  - System
License: MIT
AuthorName: d3ja7u
SourceCode: https://github.com/d3ja7u/DuoLauncher
IssueTracker: https://github.com/d3ja7u/DuoLauncher/issues
WebSite: https://github.com/d3ja7u/DuoLauncher
Changelog: https://github.com/d3ja7u/DuoLauncher/releases
Translation: https://github.com/d3ja7u/DuoLauncher/tree/main/app/src/main/res
AutoName: DuoLauncher

# 可选功能依赖专有网络服务，主动申报，避免审核时被追问
AntiFeatures:
  NonFreeNet:
    en-US: The optional "Check for updates" feature queries the GitHub Releases API (or releases.atom), and can download an APK only when the user explicitly taps "Download and install". GitHub is a proprietary service. The check is off by default, can be disabled in Settings, and is not required for the launcher to function. Nothing is downloaded or installed in the background.
  Tracking:
    en-US: Optional anonymous usage statistics send a random local ID, app version, UI language and Android API level to a statistics endpoint to count devices. The user is asked on first launch before anything is sent, can turn it off at any time in Settings (which deletes the local ID), clear the endpoint, or point it at a self-hosted server. No device identifiers, IP storage, contacts, location or usage content. Disabling it affects no launcher feature. See PRIVACY.md.

RepoType: git
Repo: https://github.com/d3ja7u/DuoLauncher.git

Builds:
  - versionName: '1.5.14'
    versionCode: 197
    commit: a1091aab4e08892d0cf8fbbacfb309189ed3ed6b
    subdir: app
    gradle:
      - yes
    # gradle: yes -> assembleRelease（无 productFlavor）。
    # 该构建是 release 类型：debuggable=false、已开启 R8 与资源缩减。
    # signingConfig 指向 debug.keystore，fdroidserver 会用自己的密钥重新签名产物。
    # settings.gradle.kts 默认使用阿里云 Maven 镜像（仓库中没有 cnMirror 开关）。
    # 若构建机访问不了，按维护者建议加 prebuild 把仓库换成 google() / mavenCentral()。

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: '1.5.14'
CurrentVersionCode: 197
