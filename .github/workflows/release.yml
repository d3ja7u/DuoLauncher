name: Release

# 两种触发方式：
#   1. 推送形如 v1.3.9 的 tag —— 编译 APK 并发布 GitHub Release（正式发版）
#   2. Actions 页面手动 Run workflow —— 只编译并留存 artifact，不发 Release（预演验证）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建 APK 并发布 Release
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      #  runner 镜像自带 Android SDK（ANDROID_HOME 已预设），无需 setup-android。
      #  该 action 会尝试装已被新版 cmdline-tools 移除的 `tools` 包而失败，这里直接用预装的 sdkmanager。
      - name: 准备 Android SDK 34
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          export ANDROID_HOME="$SDK" ANDROID_SDK_ROOT="$SDK"

          SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $SDKM"
          [ -n "$SDKM" ] || { echo "::error::未找到 sdkmanager"; exit 1; }

          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5
          echo "--- 已安装平台 ---"
          ls "$SDK/platforms"

      # settings.gradle.kts 里为国内构建预置了阿里云镜像，Actions 跑在海外，
      # 这里换回 google() / gradlePluginPortal() / mavenCentral()
      - name: 依赖仓库换回官方源
        run: |
          sed -i 's#maven { url = uri("https://maven.aliyun.com/repository/google") }#google()#g' settings.gradle.kts
          sed -i 's#maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }#gradlePluginPortal()#g' settings.gradle.kts
          sed -i 's#maven { url = uri("https://maven.aliyun.com/repository/public") }#mavenCentral()#g' settings.gradle.kts
          echo "--- 替换后的仓库配置 ---"
          sed -n '1,40p' settings.gradle.kts

      # 在仓库 Secrets 里配置 DEBUG_KEYSTORE_B64（本机 ~/.android/debug.keystore 的
      # base64），CI 产出的包就会与本地调试包同签名，可直接覆盖安装；
      # 未配置则用 CI 自动生成的调试签名，装新版前要先卸载旧版
      - name: 还原签名密钥（可选）
        env:
          KS_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          KS="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$KS"
            echo "已写入 $KS（$(wc -c < "$KS") 字节）"
            "$JAVA_HOME/bin/keytool" -list -v -keystore "$KS" -storepass android 2>&1 \
              | grep -E "^Alias name|SHA256:" || true
            echo "::notice::CI 将使用仓库 Secrets 中的 debug.keystore 签名"
          else
            rm -f "$KS"
            echo "::warning::未配置 DEBUG_KEYSTORE_B64，使用 CI 自动生成的调试签名"
          fi

      # tag 与 app/build.gradle.kts 里的 versionName 必须一致，
      # 否则打出来的包版本号和 Release 标题对不上，这里直接拦下来
      - name: 校验版本号
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | grep -oE '[0-9][^"]*')
          echo "tag: $TAG_VERSION / build.gradle.kts: $FILE_VERSION"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION 与 app/build.gradle.kts 的 versionName $FILE_VERSION 不一致"
            exit 1
          fi

      - name: 编译
        run: |
          if [ -f "$HOME/.android/debug.keystore" ]; then
            export DUO_KEYSTORE="$HOME/.android/debug.keystore"
            echo "签名：使用还原出的 keystore（$DUO_KEYSTORE）"
          else
            echo "签名：使用 CI 自动生成的调试签名"
          fi

          chmod +x gradlew
          # 必须是 release 构建：debug 包带 debuggable 标记，且体积 52 MB，
          # 超过 IzzyOnDroid 的 30 MB 上限。release 开启 R8 与资源缩减。
          ./gradlew assembleRelease --no-daemon --stacktrace

          echo "--- 产物签名指纹 ---"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk | grep -E "SHA-256 digest|DN:"

          echo "--- 体积校验（IzzyOnDroid 上限 30 MB）---"
          APK="app/build/outputs/apk/release/app-release.apk"
          SIZE=$(stat -c%s "$APK")
          echo "APK: $SIZE 字节 / $((SIZE / 1024 / 1024)) MB"
          if [ "$SIZE" -gt 31457280 ]; then
            echo "::error::APK 超过 30 MB，IzzyOnDroid 不会收录，请检查 R8 是否生效"
            exit 1
          fi

      - name: 整理产物
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | grep -oE '[0-9][^"]*')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/DuoLauncher-${VERSION}.apk"
          ls -lh out

      # 手动触发的预演：只留 artifact，不产生 Release
      - name: 留存预演包
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: DuoLauncher-${{ env.VERSION }}-preview
          path: out/*.apk
          retention-days: 7

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DuoLauncher ${{ github.ref_name }}
          files: out/*.apk
          generate_release_notes: true
          append_body: true
          body: |

            ## 安装

            1. 下载下方 `DuoLauncher-*.apk`；
            2. 允许「安装未知来源应用」后直接安装；
            3. 首次使用建议在系统里把 DuoLauncher 设为默认桌面，否则按 Home 键会回到原桌面。

            需要的额外授权（按需，不是必需）：

            - 通知角标：设置 → 通知角标 → 授予「通知使用权」；
            - 双击息屏：设置 → 主屏幕与手势 → 按提示开启无障碍服务；
            - 联系人搜索：在搜索页开启后按提示授予「通讯录」权限（仅本机匹配，不上传）；
            - 在线更新：设置 → 检查更新 → 点「下载并安装」，首次需允许「安装未知来源应用」。

            新版默认主屏为空，可在长按空白的菜单里编辑；旧配置可在「设置 → 备份与恢复」导出后导入到新设备。

            详细操作说明见 [README](https://github.com/d3ja7u/DuoLauncher#readme)。

            > 此包为 release 构建（非 debuggable、已开启 R8），签名与旧版一致，手机上装有旧版时可直接覆盖安装。
